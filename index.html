<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML Converter</title>
<style>
  :root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e1dc;--acc:#2f5bd3;--ok:#1a7f4b;--bad:#b3261e;--warn:#8a5300}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:640px;margin:0 auto;padding:28px 20px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
  header h1{margin:0;font-size:22px}
  header .sub{color:var(--mute);font-size:14px}
  button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  button.link{border:0;background:none;color:var(--mute);text-decoration:underline;padding:8px 4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
  .card h2{margin:0 0 12px;font-size:16px}
  .topright{display:flex;gap:8px;align-items:center}
  .langbox{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px}
  .flag{border:2px solid transparent;border-radius:8px;padding:4px 6px;background:none;line-height:0}
  .flag svg{width:36px;height:24px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.12);display:block}
  .flag.on{border-color:var(--acc)}
  .flag:disabled{opacity:.4;cursor:default}
  #btnSettings{font-size:18px;padding:8px 11px}
  label{display:block;font-size:14px;font-weight:600;margin:14px 0 4px}
  label:first-of-type{margin-top:0}
  input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;width:100%}
  .hint{font-size:12px;color:var(--mute);margin-top:3px}
  details summary{cursor:pointer;color:var(--mute);font-size:13px;margin-top:14px}
  .row{display:flex;gap:8px;align-items:center;margin-top:16px}
  .small{font-size:13px;color:var(--mute)}
  #drop{border:2px dashed #c9c6bf;border-radius:12px;padding:44px 20px;text-align:center;cursor:pointer;transition:.15s}
  #drop.over{border-color:var(--acc);background:#eef2fd}
  #drop b{font-size:17px}
  #status{display:flex;gap:10px;align-items:center;margin-top:16px;font-size:14px}
  #status[hidden],#done[hidden],#setup[hidden]{display:none}
  #status.err{color:var(--bad)} #status.ok{color:var(--ok)} #status.warn{color:var(--warn)}
  .spin{width:14px;height:14px;border:2px solid var(--acc);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  #done{margin-top:14px}
  #done iframe{width:100%;height:420px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-top:10px}
  #setMsg{font-size:13px;margin-top:8px;color:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>HTML Converter</h1>
      <div class="sub">Upload an HTML file to convert it.</div>
    </div>
    <div class="topright">
      <div class="langbox" id="langbox" role="radiogroup" aria-label="Language"></div>
      <button id="btnSettings" title="Setup" aria-label="Setup">⚙</button>
    </div>
  </header>

  <section class="card" id="setup" hidden>
    <h2>Setup</h2>
    <label for="sGh">GitHub token</label>
    <input id="sGh" type="password" placeholder="github_pat_…" autocomplete="off">
    <div class="hint">Needs access to your private repo only.</div>

    <label for="sRepo">Private repo</label>
    <input id="sRepo" type="text" placeholder="your-username/your-private-repo" autocomplete="off">

    <div class="row">
      <button class="primary" id="btnSave">Save</button>
      <button class="link" id="btnForget">Forget keys</button>
    </div>
    <div id="setMsg"></div>
    <p class="small" style="margin:12px 0 0">Saved only in this browser, on this computer.</p>
  </section>

  <section class="card">
    <div id="drop">
      <b>Drop an HTML file here</b>
      <div class="small">or click to choose one</div>
      <input type="file" id="file" accept=".html,.htm" hidden>
    </div>
    <div id="status" hidden></div>
    <div id="done" hidden>
      <button class="primary" id="btnDl">Download</button>
      <button id="btnMiss" hidden>Copy missing texts</button>
      <span class="small" id="copyMsg"></span>
      <details><summary>Preview</summary><iframe id="fB" sandbox></iframe></details>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);

/* ---------- flags (each flag is one language; its rules live in the private repo) ---------- */
const FLAG_PT = `<svg viewBox="0 0 600 400"><rect width="600" height="400" fill="#da291c"/><rect width="240" height="400" fill="#046a38"/><circle cx="240" cy="200" r="78" fill="none" stroke="#ffe900" stroke-width="16"/><path d="M200 150h80v62a40 40 0 0 1-80 0z" fill="#fff" stroke="#da291c" stroke-width="12"/><g fill="#002d72"><rect x="232" y="168" width="16" height="22"/><rect x="232" y="200" width="16" height="22"/><rect x="214" y="184" width="16" height="22"/><rect x="250" y="184" width="16" height="22"/></g></svg>`;
const FLAG_FI = `<svg viewBox="0 0 18 11"><rect width="18" height="11" fill="#fff"/><rect x="5" width="3" height="11" fill="#002f6c"/><rect y="4" width="18" height="3" fill="#002f6c"/></svg>`;
const LANGS = { pt:{flag:FLAG_PT, enabled:true}, fi:{flag:FLAG_FI, enabled:true} };

/* ---------- settings (kept only in this browser) ---------- */
const store = {
  get(k, d=''){ try{ return localStorage.getItem('htmlconv.'+k) ?? d; }catch(e){ return d; } },
  set(k, v){ try{ v ? localStorage.setItem('htmlconv.'+k, v) : localStorage.removeItem('htmlconv.'+k); }catch(e){} }
};
const cfg = () => ({ gh:store.get('gh'), repo:store.get('repo') });
const ready = () => { const c = cfg(); return !!(c.gh && c.repo); };

let LANG = LANGS[store.get('lang')]?.enabled ? store.get('lang') : 'pt';
function renderLangs(){
  $('langbox').innerHTML = Object.entries(LANGS).map(([code,l]) =>
    `<button class="flag${code===LANG?' on':''}" data-code="${code}" role="radio" aria-checked="${code===LANG}" aria-label="Language" ${l.enabled?'':'disabled title="Coming soon"'}>${l.flag}</button>`).join('');
  $('langbox').querySelectorAll('.flag:not(:disabled)').forEach(b => b.onclick = () => { LANG = b.dataset.code; store.set('lang', LANG); renderLangs(); });
}
function fillForm(){ const c = cfg(); $('sGh').value=c.gh; $('sRepo').value=c.repo; }
$('btnSettings').onclick = () => { $('setup').hidden = !$('setup').hidden; };
$('btnSave').onclick = () => {
  store.set('gh',$('sGh').value.trim());
  store.set('repo',$('sRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,''));
  if (ready()){ $('setMsg').textContent=''; $('setup').hidden = true; setStatus('ok','Saved. Drop a file to start.'); }
  else { $('setMsg').style.color='var(--bad)'; $('setMsg').textContent='Please fill in both fields.'; }
};
$('btnForget').onclick = () => { ['gh','repo'].forEach(k=>store.set(k,'')); fillForm(); $('setMsg').style.color='var(--ok)'; $('setMsg').textContent='Removed from this computer.'; };

/* ---------- status line ---------- */
function setStatus(kind, text){ const s=$('status'); if(!text){ s.hidden=true; return; } s.hidden=false; s.className=kind;
  s.innerHTML = (kind==='run' ? '<span class="spin"></span>' : '') + '<span></span>'; s.lastChild.textContent = text; }

/* ---------- private repo: database + settings ---------- */
const b64dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g,'')), c=>c.charCodeAt(0)));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

const GH = {
  url(path){ return `https://api.github.com/repos/${cfg().repo}/contents/${path.split('/').map(encodeURIComponent).join('/')}`; },
  headers(){ return {Authorization:'Bearer '+cfg().gh, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'}; },
  async get(path){
    const r = await fetch(this.url(path)+'?t='+Date.now(), {headers:this.headers(), cache:'no-store'});
    if (r.status===404) return null;
    if (r.status===401) throw new Error('GitHub token was rejected. Check it in setup (⚙).');
    if (r.status===403) throw new Error('GitHub token has no access to the private repo. Check it in setup (⚙).');
    if (!r.ok) throw new Error('GitHub error '+r.status+'.');
    const j = await r.json(); return {text:b64dec(j.content), sha:j.sha};
  }
};
const dbPath = () => `glossary-${LANG}.json`, rulesPath = () => `rules-${LANG}.json`;

async function loadDb(){ const f = await GH.get(dbPath()); if (!f) return {db:{}, sha:null}; const p = JSON.parse(f.text||'{}'); return {db:p.entries||p, sha:f.sha}; }
async function loadRules(){                          // optional: settings for this language
  const f = await GH.get(rulesPath()); if (!f) return {};
  try{ return JSON.parse(f.text) || {}; }catch(e){ throw new Error(rulesPath()+' is not valid JSON.'); }
}

/* ---------- reuse: same sentence with different numbers ---------- */
const NUM_RE = /\[\[\/?\d+\]\]|(\d+(?:[.,]\d+)*)/g;
const templ = s => { const nums=[]; const t=s.replace(NUM_RE,(m,g)=>{ if(!g) return m; nums.push(g); return `{#${nums.length-1}}`; }); return {t,nums}; };
const swapSep = n => n.replace(/[.,]/g, c => c==='.'?',':'.');
function buildTemplates(db, swapDec){ const T={};
  for (const [en,out] of Object.entries(db)){ const {t,nums}=templ(en); if(!nums.length) continue; let tp=out, ok=true; const swap=[];
    nums.forEach((n,i)=>{ if(!ok) return; const cands=[[n,false]]; if (swapDec) cands.push([swapSep(n),true]);
      for (const [c,sw] of cands){ const re=new RegExp('(?<![\\d{#])'+escRe(c)+'(?!\\d)'); if(re.test(tp)){ tp=tp.replace(re,`{#${i}}`); swap[i]=sw; return; } } ok=false; });
    if (ok && !T[t]) T[t]={tp,swap}; }
  return T; }
function lookup(key, db, T){
  if (db[key]!=null) return db[key];
  const {t,nums}=templ(key); const e = nums.length && T[t];
  return e ? e.tp.replace(/\{#(\d+)\}/g,(m,i)=> e.swap[i]?swapSep(nums[i]):nums[i]) : null;
}

/* ---------- HTML: split into texts, keep tags/images/layout untouched ---------- */
const SKIP = new Set(['SCRIPT','STYLE','NOSCRIPT','TEMPLATE','CODE','PRE','SVG','MATH']);
const INLINE = new Set(['B','STRONG','I','EM','U','S','SPAN','SUP','SUB','BR','FONT','SMALL','BIG','MARK','A','ABBR','Q','CITE','INS','DEL']);
const VOID = new Set(['br','img','wbr','hr','input']);
const ATTRS = ['alt','title','placeholder','aria-label'];
const hasLetters = s => /\p{L}/u.test(s);
const norm = s => s.replace(/\s+/g,' ').trim();
const escTxt = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/ /g,'&nbsp;');
const escAttr = s => s.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
const markers = s => (s.match(/\[\[\/?\d+\]\]/g)||[]).sort().join(',');
const inlineOnly = el => { for (const c of el.querySelectorAll('*')) if(!INLINE.has(c.tagName.toUpperCase())) return false; return true; };

function toSegment(el){ const tags=[]; let s='';
  (function walk(n){ for (const c of n.childNodes){
    if (c.nodeType===3) s+=c.nodeValue;
    else if (c.nodeType===8){ const i=tags.length; tags.push({open:`<!--${c.data}-->`,close:''}); s+=`[[${i}]]`; }
    else if (c.nodeType===1){ const t=c.tagName.toLowerCase(), i=tags.length;
      const open='<'+t+Array.from(c.attributes).map(a=>` ${a.name}="${escAttr(a.value)}"`).join('')+'>';
      if (VOID.has(t)){ tags.push({open,close:''}); s+=`[[${i}]]`; } else { tags.push({open,close:`</${t}>`}); s+=`[[${i}]]`; walk(c); s+=`[[/${i}]]`; } } } })(el);
  return {key:norm(s), tags}; }
const restore = (txt, tags) => txt.split(/(\[\[\/?\d+\]\])/).map(p=>{ const m=p.match(/^\[\[(\/?)(\d+)\]\]$/); if(!m) return escTxt(p); const t=tags[+m[2]]; return m[1]?t.close:t.open; }).join('');

function collectAttrs(el, out){ for (const a of ATTRS){ const v=el.getAttribute(a); if (v && hasLetters(v)) out.push({kind:'attr',node:el,attr:a,key:norm(v)}); } }
function collect(node, out){
  for (const c of Array.from(node.childNodes)){
    if (c.nodeType===3){ if (hasLetters(c.nodeValue)) out.push({kind:'text',node:c,key:norm(c.nodeValue)}); }
    else if (c.nodeType===1){ const T=c.tagName.toUpperCase(); if (SKIP.has(T)) continue; collectAttrs(c,out);
      if (!INLINE.has(T) && hasLetters(c.textContent) && c.children.length && inlineOnly(c)){
        const seg=toSegment(c); out.push({kind:'html',node:c,key:seg.key,tags:seg.tags}); c.querySelectorAll('*').forEach(d=>collectAttrs(d,out));
      } else collect(c,out); }
  }
}
function parse(src){ const doc=new DOMParser().parseFromString(src,'text/html'); const segs=[]; collect(doc.documentElement,segs); return {doc,segs}; }
function apply(doc, segs, db, rules){
  const T = buildTemplates(db, rules.swapDecimal); const left=new Set();
  for (const s of segs){ const out = lookup(s.key, db, T);
    if (out==null || (s.kind==='html' && markers(out)!==markers(s.key))) { left.add(s.key); continue; }
    if (s.kind==='text'){ const v=s.node.nodeValue; s.node.nodeValue = v.match(/^\s*/)[0]+out+v.match(/\s*$/)[0]; }
    else if (s.kind==='attr') s.node.setAttribute(s.attr, out);
    else s.node.innerHTML = restore(out, s.tags);
  }
  if (rules.htmlLang) doc.documentElement.setAttribute('lang', rules.htmlLang);
  doc.querySelectorAll('meta[http-equiv="Content-Type" i]').forEach(m=>m.remove());
  let cs=doc.querySelector('meta[charset]'); if(!cs){ cs=doc.createElement('meta'); doc.head.prepend(cs); } cs.setAttribute('charset','utf-8');
  return {html:(doc.doctype?'<!DOCTYPE html>\n':'')+doc.documentElement.outerHTML, left:[...left]};
}

/* ---------- the pipeline ---------- */
let OUT='', OUT_NAME='', MISSING=[];
async function convert(src, name){
  $('done').hidden = true; $('copyMsg').textContent='';
  if (!ready()){ $('setup').hidden = false; setStatus('err','Finish the setup first (fill in both fields).'); return; }
  try{
    setStatus('run','Reading your private repo…');
    const rules = await loadRules();
    const {db} = await loadDb();
    const {doc, segs} = parse(src);
    const r = apply(doc, segs, db, rules);
    OUT = r.html; OUT_NAME = name.replace(/(\.html?)?$/i,'_converted.html'); MISSING = r.left;
    $('fB').srcdoc = OUT; $('done').hidden = false; $('btnMiss').hidden = !MISSING.length;
    const n = MISSING.length;
    if (n) setStatus('warn', `Done, but ${n} text${n===1?' isn\'t':'s aren\'t'} in the database yet and ${n===1?'was':'were'} left as written.`);
    else setStatus('ok','Done. Every text was found in the database.');
  } catch(e){ setStatus('err', e.message || String(e)); }
}

/* ---------- file input ---------- */
const drop=$('drop');
drop.onclick = () => $('file').click();
$('file').onchange = e => readFile(e.target.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); readFile(e.dataTransfer.files[0]); };
function readFile(f){ if(!f) return; const r=new FileReader(); r.onload=()=>convert(r.result, f.name); r.readAsText(f); $('file').value=''; }
$('btnDl').onclick = () => { try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([OUT],{type:'text/html'})); a.download=OUT_NAME; document.body.appendChild(a); a.click(); a.remove(); }catch(e){ setStatus('err','The browser blocked the download.'); } };

$('btnMiss').onclick = async () => {
  const o = {}; MISSING.forEach(k=>o[k]='');
  try{ await navigator.clipboard.writeText(JSON.stringify(o, null, 2)); $('copyMsg').textContent='Copied. Paste it into the chat.'; }
  catch(e){ $('copyMsg').textContent='The browser blocked copying.'; }
};
renderLangs(); fillForm();
if (!ready()) $('setup').hidden = false;
</script>
</body>
</html>
